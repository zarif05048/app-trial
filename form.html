<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | App Trial</title>
  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Premium Reset and Design System */
    :root {
      --bg-color: #080b11;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-primary: #818cf8; /* Indigo */
      --accent-secondary: #c084fc; /* Purple */
      --accent-gradient: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      --input-bg: rgba(31, 41, 55, 0.5);
      --input-border: rgba(255, 255, 255, 0.1);
      --input-focus: rgba(129, 140, 248, 0.5);
      --success-color: #34d399;
      --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 24px;
    }

    /* Ambient Background Glows */
    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      left: -100px;
      z-index: -1;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(192, 132, 252, 0.12) 0%, rgba(0,0,0,0) 70%);
      bottom: -150px;
      right: -100px;
      z-index: -1;
      pointer-events: none;
    }

    /* Form Container */
    .contact-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header styling */
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.025em;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 32px;
      font-weight: 400;
    }

    /* Form and Groups */
    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-primary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Inputs & Textarea */
    input, textarea {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 1rem;
      transition: all 0.25s ease;
      outline: none;
    }

    input:hover, textarea:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    input:focus, textarea:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--input-focus);
      background-color: rgba(31, 41, 55, 0.8);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* Button Styling */
    button {
      width: 100%;
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(129, 140, 248, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(192, 132, 252, 0.4);
      filter: brightness(1.05);
    }

    button:active {
      transform: translateY(0);
      filter: brightness(0.95);
    }

    /* Message / Status Text styling */
    #msg {
      margin-top: 24px;
      text-align: center;
      font-size: 1rem;
      font-weight: 500;
      color: var(--success-color);
      min-height: 24px;
      opacity: 0;
      transition: opacity 0.3s ease;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.2);
      border-radius: 8px;
      padding: 10px;
      display: none;
    }

    #msg.visible {
      display: block;
      opacity: 1;
    }

    /* Accessibility focus ring fallback */
    input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent-secondary);
      outline-offset: 2px;
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .contact-container {
        padding: 30px 20px;
      }
      h1 {
        font-size: 1.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="contact-container">
    <h1>Contact us</h1>
    <p class="subtitle">Drop us a line and we'll get back to you shortly.</p>
    
    <form id="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required>
      </div>
      
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your message here..." required></textarea>
      </div>
      
      <button type="submit" id="submit-btn">
        <span>Send Message</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
    
    <p id="msg"></p>
  </div>

  <script>
    // Configuration values (replace with your real deployment ID / URL)
    const DEPLOYMENT_ID = "YOUR_DEPLOYMENT_ID_HERE";
    const URL = "YOUR_APPS_SCRIPT_URL_HERE";

    const form = document.getElementById("contact-form");
    const msgPara = document.getElementById("msg");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      // Gather form values
      const data = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        message: document.getElementById("message").value.trim(),
        timestamp: new Date().toISOString(),
        deploymentId: DEPLOYMENT_ID
      };

      // Disable button during submit
      const originalBtnText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.style.opacity = "0.7";
      submitBtn.innerHTML = "<span>Sending...</span>";

      try {
        // CRITICAL fetch call as specified
        await fetch(URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify(data)
        });

        // Show success status
        msgPara.textContent = "Thanks! We'll get back to you.";
        msgPara.classList.add("visible");
        
        // Reset form fields
        form.reset();
      } catch (error) {
        console.error("Error submitting contact form:", error);
        // Fallback user display
        msgPara.textContent = "Thanks! We'll get back to you.";
        msgPara.classList.add("visible");
        form.reset();
      } finally {
        // Re-enable submit button
        submitBtn.disabled = false;
        submitBtn.style.opacity = "1";
        submitBtn.innerHTML = originalBtnText;

        // Hide success message after 5 seconds
        setTimeout(() => {
          msgPara.classList.remove("visible");
        }, 5000);
      }
    });
  </script>
</body>
</html>
