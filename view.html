<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submissions | App Trial</title>
  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Premium Reset and Design System */
    :root {
      --bg-color: #080b11;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-primary: #818cf8; /* Indigo */
      --accent-secondary: #c084fc; /* Purple */
      --accent-gradient: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      --item-bg: rgba(255, 255, 255, 0.03);
      --item-border: rgba(255, 255, 255, 0.05);
      --error-color: #f87171;
      --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      overflow-x: hidden;
      padding: 40px 24px;
    }

    /* Ambient Background Glows */
    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.12) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      left: -100px;
      z-index: -1;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(192, 132, 252, 0.1) 0%, rgba(0,0,0,0) 70%);
      bottom: -150px;
      right: -100px;
      z-index: -1;
      pointer-events: none;
    }

    /* Container */
    .submissions-container {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header styling */
    header {
      margin-bottom: 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.025em;
    }

    /* List styling */
    ul {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    li {
      background: var(--item-bg);
      border: 1px solid var(--item-border);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      animation: slideIn 0.5s ease forwards;
    }

    li:hover {
      transform: translateY(-2px);
      border-color: rgba(129, 140, 248, 0.3);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Submitter details */
    .submitter-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .name {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 1.05rem;
    }

    .email {
      color: var(--accent-primary);
      font-size: 0.9rem;
      font-weight: 400;
    }

    /* Message content */
    .message {
      color: var(--text-secondary);
      font-size: 0.975rem;
      line-height: 1.5;
      margin-bottom: 12px;
      word-break: break-word;
    }

    /* Timestamp info */
    .date {
      display: block;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.35);
      text-align: right;
    }

    /* Status Messages (Loading, Empty, Error) */
    .status-container {
      text-align: center;
      padding: 40px 0;
      color: var(--text-secondary);
    }

    /* Spinner animation */
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      border-top-color: var(--accent-primary);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 1.05rem;
      font-weight: 500;
    }

    .status-error {
      color: var(--error-color);
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 12px;
      padding: 16px;
    }

    .status-empty {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      .submissions-container {
        padding: 24px 16px;
      }
      h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="submissions-container">
    <header>
      <h1>All submissions</h1>
    </header>

    <!-- Submissions list -->
    <ul id="list">
      <!-- Loaded dynamically -->
    </ul>

    <!-- Loading, empty, and error templates -->
    <div id="status-viewer" class="status-container">
      <div id="spinner" class="spinner"></div>
      <div id="status-message" class="status-text">Loading submissions...</div>
    </div>
  </div>

  <script>
    // Configuration values (replace with your real deployment ID / URL)
    const DEPLOYMENT_ID = "YOUR_DEPLOYMENT_ID_HERE";
    const URL = "YOUR_APPS_SCRIPT_URL_HERE";

    const listElement = document.getElementById("list");
    const statusViewer = document.getElementById("status-viewer");
    const spinner = document.getElementById("spinner");
    const statusMessage = document.getElementById("status-message");

    function showStatus(text, type = "info") {
      spinner.style.display = "none";
      statusViewer.style.display = "block";
      statusMessage.textContent = text;
      
      statusViewer.className = "status-container"; // reset
      if (type === "error") {
        statusMessage.className = "status-text status-error";
      } else if (type === "empty") {
        statusMessage.className = "status-text status-empty";
      } else {
        statusMessage.className = "status-text";
      }
    }

    function formatDate(dateString) {
      if (!dateString) return "";
      try {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString;
        return date.toLocaleDateString(undefined, { 
          year: 'numeric', 
          month: 'short', 
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return dateString;
      }
    }

    async function loadSubmissions() {
      try {
        // CRITICAL fetch call as specified
        const res = await fetch(URL);
        const data = await res.json();

        // Check if query resolved correctly
        if (data && data.ok && data.contacts && data.contacts.length > 0) {
          statusViewer.style.display = "none"; // Hide loading spinner
          listElement.innerHTML = ""; // Clear list

          data.contacts.forEach((contact, index) => {
            const li = document.createElement("li");
            li.style.animationDelay = `${index * 0.05}s`;

            // Setup elements according to specification:
            // - name (bold)
            // - email (in parentheses)
            // - message (in a paragraph below)
            // - created_at (small text)
            const submitterInfo = document.createElement("div");
            submitterInfo.className = "submitter-info";

            const nameEl = document.createElement("span");
            nameEl.className = "name";
            nameEl.textContent = contact.name || "Anonymous";

            const emailEl = document.createElement("span");
            emailEl.className = "email";
            emailEl.textContent = `(${contact.email || "No Email"})`;

            submitterInfo.appendChild(nameEl);
            submitterInfo.appendChild(emailEl);

            const messageEl = document.createElement("p");
            messageEl.className = "message";
            messageEl.textContent = contact.message || "";

            const dateEl = document.createElement("small");
            dateEl.className = "date";
            // Check for 'created_at' or 'timestamp' in response
            const timestamp = contact.created_at || contact.timestamp || "";
            dateEl.textContent = timestamp ? formatDate(timestamp) : "";

            li.appendChild(submitterInfo);
            li.appendChild(messageEl);
            li.appendChild(dateEl);

            listElement.appendChild(li);
          });
        } else {
          showStatus("No submissions yet", "empty");
        }
      } catch (error) {
        console.error("Error loading submissions:", error);
        showStatus("Couldn't load — try again later", "error");
      }
    }

    // Run load on page initialization
    window.addEventListener("DOMContentLoaded", loadSubmissions);
  </script>
</body>
</html>
